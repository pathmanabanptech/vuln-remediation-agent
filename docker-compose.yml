services:
  # The "Agent": MCP Bridge + Trivy + GitHub Tools
  vuln-remediation-agent:
    build: .
    container_name: vuln-remediation-agent
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      # Ollama server: the same machine by default, or a private-network address such as
      # http://ollama.internal:11434 in your VPC. Never a public endpoint: prompts carry source code.
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_HOST=${OLLAMA_URL:-http://host.docker.internal:11434}
      # Any Ollama model with tool-calling support. Override: OLLAMA_MODEL=qwen2.5:7b-instruct docker compose up -d
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      # Context window (tokens). Ollama's 4096 default is smaller than one Trivy findings list.
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-16384}
      # Cap on tool-call rounds per request, so a model stuck retrying can't loop forever.
      - MAX_TOOL_ROUNDS=${MAX_TOOL_ROUNDS:-15}
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_TOKEN} # Loaded from your local .env file
      # The bridge has no auth and defaults to CORS "*", letting any website you visit drive
      # the agent through your browser. There is no browser client, so allow no foreign origins.
      - CORS_ORIGINS=http://localhost:8000
      # Required by api-guard: callers must send "Authorization: Bearer <token>".
      - AGENT_API_TOKEN=${AGENT_API_TOKEN}
      # Repository to remediate (defaults: this repo's demo app). The GitHub token must be
      # scoped to TARGET_REPO; the guard rejects GitHub calls for any other repository.
      - TARGET_REPO=${TARGET_REPO:-pathmanabanptech/vuln-remediation-agent}
      - TARGET_BRANCH=${TARGET_BRANCH:-main}
      # Directory containing package.json, relative to the repository root ("." for the root).
      - TARGET_PATH=${TARGET_PATH:-my-demo-app}
    volumes:
      - .:/app
      # Local checkout of TARGET_REPO, scanned read-only. Point TARGET_DIR at another clone.
      - ${TARGET_DIR:-.}:/workspace/target:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # model-preflight exits the container if OLLAMA_MODEL can't make tool calls.
    # render-prompt fills the target settings into agent_prompt.md (and fails on bad settings).
    # api-guard owns port 8000 and authenticates every request; the bridge listens only on
    # 127.0.0.1:8001 inside the container, so it cannot be reached around the guard.
    command: >
      /bin/sh -c "node /app/scripts/model-preflight.js &&
      PROMPT=$$(node /app/scripts/render-prompt.js) &&
      exec node /app/api-guard/api-guard.js --
      ollama-mcp-bridge
      --config /app/mcp-config.json
      --host 127.0.0.1
      --port 8001
      --system-prompt \"$$PROMPT\""

